name: build-apk
run-name: Build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: job id
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ambil config dari job
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "job-${{ inputs.job }}" -p pack.json -D /tmp

      - name: Terapkan config ke template
        run: python3 .github/scripts/apply.py /tmp/pack.json android

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG=$(cat /tmp/slug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "/tmp/$SLUG.apk"
          gh release upload "job-${{ inputs.job }}" "/tmp/$SLUG.apk"
          gh release delete-asset "job-${{ inputs.job }}" pack.json -y
